<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppletTestPilot — Agent Live Monitor</title>
<style>
  :root {
    --bg:#0B0F1A; --surface:#0F172A; --card:#111C33; --border:rgba(148,163,184,0.22);
    --text:#F8FAFC; --muted:#94A3B8; --primary:#7C3AED; --secondary:#22D3EE;
    --observe:#22D3EE; --plan:#7C3AED; --execute:#F97316; --oracle:#22C55E;
    --result-ok:#22C55E; --result-fail:#F43F5E; --error:#F43F5E; --session:#FBBF24;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'JetBrains Mono','Consolas','Microsoft YaHei',monospace;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  /* ── Control Panel ── */
  #controls{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
  #controls label{font-size:11px;color:var(--muted);white-space:nowrap}
  #controls input,#controls select{padding:5px 8px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;min-width:130px}
  #controls input:focus,#controls select:focus{outline:none;border-color:var(--primary)}
  .browse-btn{padding:5px 10px;background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:5px;font-size:11px;cursor:pointer;font-family:inherit}
  .browse-btn:hover{color:var(--text);border-color:var(--secondary)}
  #controls .btn{padding:6px 16px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
  .btn-analyze{background:linear-gradient(135deg,var(--secondary),var(--primary));color:#0B0F1A}
  .btn-start{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#0B0F1A}
  .btn-start:hover,.btn-analyze:hover{transform:scale(1.03);box-shadow:0 0 20px rgba(124,58,237,.5)}
  .btn-start:disabled,.btn-analyze:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-stop{background:var(--error);color:#fff}
  .btn-next{background:linear-gradient(135deg,var(--oracle),var(--secondary));color:#0B0F1A)}
  .btn-reset{background:transparent;color:var(--muted);border:1px solid var(--border)}
  #controls .sep{width:1px;height:22px;background:var(--border);margin:0 3px}
  #status-bar{display:flex;align-items:center;gap:12px;font-size:10px;color:var(--muted);margin-left:auto}
  #status-bar .dot{width:7px;height:7px;border-radius:50%;background:#666;display:inline-block}
  #status-bar .dot.running{background:var(--session);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  /* ── Main Area ── */
  #main{display:flex;flex:1;overflow:hidden}
  #log-panel{flex:6;display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0}
  #log-header{padding:6px 14px;background:var(--card);border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  #log-list{flex:1;overflow-y:auto;padding:3px 0}
  .log-entry{padding:4px 14px;border-left:3px solid transparent;font-size:11px;line-height:1.5;animation:fadeIn .2s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
  .log-entry .ts{color:var(--muted);font-size:10px;margin-right:5px}
  .log-entry .phase{font-weight:700;margin-right:5px;min-width:60px;display:inline-block;font-size:11px}
  .log-entry.observe{border-left-color:var(--observe)} .log-entry.plan{border-left-color:var(--plan)}
  .log-entry.execute{border-left-color:var(--execute)} .log-entry.oracle{border-left-color:var(--oracle)}
  .log-entry.result-ok{border-left-color:var(--result-ok)} .log-entry.result-fail{border-left-color:var(--result-fail);background:rgba(244,63,94,.06)}
  .log-entry.error{border-left-color:var(--error);background:rgba(244,63,94,.08)}
  .log-entry.session{border-left-color:var(--session);text-align:center;padding:5px}
  .log-entry.analysis{border-left-color:var(--secondary);background:rgba(34,211,238,.06)}
  .phase-observe{color:var(--observe)} .phase-plan{color:var(--plan)} .phase-execute{color:var(--execute)}
  .phase-oracle{color:var(--oracle)} .phase-result-ok{color:var(--result-ok)} .phase-result-fail{color:var(--result-fail)}
  .phase-error{color:var(--error)} .phase-session{color:var(--session)} .phase-analysis{color:var(--secondary)}
  .detail-block{margin:2px 0 2px 12px;padding:2px 8px;background:var(--surface);border-radius:4px;font-size:10px;color:var(--muted);white-space:pre-wrap;word-break:break-all;max-height:100px;overflow-y:auto}
  .step-divider{padding:5px 14px;font-size:10px;color:var(--muted);border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);text-align:center}
  .badge{display:inline-block;padding:1px 6px;border-radius:7px;font-size:10px;font-weight:700;margin-right:3px}
  .badge-ok{background:rgba(34,197,94,.2);color:var(--result-ok)} .badge-fail{background:rgba(244,63,94,.2);color:var(--result-fail)}
  /* ── Screenshot ── */
  #ss-panel{flex:4;display:flex;flex-direction:column;background:var(--surface);min-width:260px}
  #ss-header{padding:6px 14px;background:var(--card);border-bottom:1px solid var(--border);font-size:11px;color:var(--muted)}
  #ss-container{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}
  #ss-container img{max-width:100%;max-height:100%;border-radius:8px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.4)}
  #ss-container .placeholder{color:var(--muted);text-align:center;font-size:12px;line-height:2}
  #ss-footer{padding:5px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);min-height:20px}
  /* ── Modal ── */
  .modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:999}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto}
  .modal h2{font-size:18px;margin-bottom:12px;color:var(--secondary)}
  .modal .plan-text{background:var(--card);border-radius:8px;padding:14px;font-size:12px;line-height:1.6;color:var(--text);white-space:pre-wrap;max-height:40vh;overflow-y:auto;margin-bottom:16px}
  .modal .btn-row{display:flex;gap:10px;justify-content:flex-end}
  .modal .btn-row .btn{padding:8px 20px;font-size:13px}
  .modal .mode-desc{font-size:11px;color:var(--muted);margin-bottom:6px}
  /* ── scrollbar ── */
  ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- ═══════════════ Control Panel ═══════════════ -->
<div id="controls">
  <label>源码</label>
  <select id="cfg-source" style="min-width:180px"><option value="objects/TestApplet">objects/TestApplet</option></select>
  <label>截图</label>
  <input id="cfg-screenshots" placeholder="outputs/screenshots" value="outputs/screenshots">
  <label>输出</label>
  <input id="cfg-output" placeholder="outputs" value="outputs">
  <div class="sep"></div>
  <button class="btn btn-analyze" id="btn-analyze" onclick="analyzePlan()">🔍 分析规划</button>
  <button class="btn btn-start" id="btn-start" onclick="startAgent('full')" disabled>▶ 全流程</button>
  <button class="btn btn-start" id="btn-step" onclick="startAgent('step')" disabled style="display:none">▶ 逐步</button>
  <button class="btn btn-next" id="btn-next" onclick="nextStep()" style="display:none">⏭ 下一个</button>
  <button class="btn btn-stop" id="btn-stop" onclick="stopAgent()" style="display:none">⏹ 停止</button>
  <button class="btn btn-reset" onclick="resetUI()">↺ 清空</button>
  <div id="status-bar">
    <span class="dot stopped" id="status-dot"></span>
    <span id="status-text">就绪</span>
    <span id="status-step"></span>
    <span id="status-time"></span>
  </div>
</div>

<!-- ═══════════════ Main Area ═══════════════ -->
<div id="main">
  <div id="log-panel">
    <div id="log-header"><span> Agent 思考与行动日志</span><span id="log-count"></span></div>
    <div id="log-list"></div>
    <div id="feedback-bar" style="display:none;padding:6px 10px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:6px">
      <input id="feedback-input" placeholder="输入反馈或新的测试需求…" style="flex:1;padding:6px 10px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit">
      <button class="btn btn-next" onclick="submitFeedback()" style="white-space:nowrap">发送</button>
    </div>
  </div>
  <div id="ss-panel">
    <div id="ss-header"> 实时状态截图</div>
    <div id="ss-container"><div class="placeholder">等待测试开始…<br><span style="font-size:11px">点击"分析规划"查看 LLM 测试方案</span></div></div>
    <div id="ss-footer"></div>
  </div>
</div>

<script>
let evtSource=null,stepCount=0,failCount=0,startTime=0;
let stepMode=false,stepPaused=false,stepTasks=[],stepTaskIdx=0;
const logList=document.getElementById('log-list'),ssContainer=document.getElementById('ss-container');
const ssFooter=document.getElementById('ss-footer'),logCount=document.getElementById('log-count');
const btnAnalyze=document.getElementById('btn-analyze'),btnStart=document.getElementById('btn-start');
const btnStep=document.getElementById('btn-step'),btnNext=document.getElementById('btn-next');
const btnStop=document.getElementById('btn-stop');
const statusDot=document.getElementById('status-dot'),statusText=document.getElementById('status-text');
const statusStep=document.getElementById('status-step'),statusTime=document.getElementById('status-time');

var PHASE_MAP={session_start:['SESSION','session','phase-session'],session_end:['SESSION','session','phase-session'],step_start:['','step',''],observe:['OBSERVE','observe','phase-observe'],plan:['PLAN','plan','phase-plan'],execute:['EXECUTE','execute','phase-execute'],oracle:['ORACLE','oracle','phase-oracle'],result:['','',''],error:['ERROR','error','phase-error'],analysis:['ANALYSIS','analysis','phase-analysis']};
function fmtTS(ts){var d=new Date(ts*1000);return d.toLocaleTimeString('zh-CN',{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0')}
function fmtDur(s){var m=Math.floor(s/60),sec=Math.floor(s%60);return m>0?m+'m '+sec+'s':sec+'s'}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function analyzePlan(){
  var source=document.getElementById('cfg-source').value.trim()||'objects/TestApplet';
  btnAnalyze.disabled=true;btnAnalyze.textContent='(analysis in progress)';
  addLogEntry('analysis','ANALYSIS','phase-analysis','LLM analyzing source and docs to generate test plan',{});
  statusText.textContent='analyzing...';statusDot.className='dot running';
  fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:source})})
  .then(function(r){return r.json()}).then(function(d){
    btnAnalyze.disabled=false;btnAnalyze.textContent='re-analyze';
    statusText.textContent='analysis complete';statusDot.className='dot stopped';
    if(d.error){addLogEntry('error','ERROR','phase-error','analysis failed: '+d.error,{});return}
    addLogEntry('analysis','ANALYSIS','phase-analysis','LLM plan ready ('+(d.tasks?d.tasks.length:0)+' tasks)',{plan:d.plan||''});
    stepTasks=d.tasks||[];
    showPlanModal(d.plan||'(empty)',d.tasks||[]);
  }).catch(function(e){btnAnalyze.disabled=false;btnAnalyze.textContent='analyze';statusText.textContent='failed';statusDot.className='dot error'});
}

function showPlanModal(planText,tasks){
  var ex=document.querySelector('.modal-overlay');if(ex)ex.remove();
  var tasksHtml=tasks.length?'<div style=\"margin-top:12px;font-size:12px;color:var(--muted)\">Found <b>'+tasks.length+'</b> test tasks</div>':'';
  var overlay=document.createElement('div');overlay.className='modal-overlay';
  var modalHtml='<div class=\"modal\"><h2>LLM 测试方案分析</h2><div class=\"plan-text\">'+esc(planText)+'</div>'+tasksHtml;
  modalHtml+='<div style=\"margin-top:14px;font-size:12px;color:var(--muted)\">请选择执行模式：</div>';
  modalHtml+='<div class=\"mode-desc\" style=\"margin-top:4px\"><b>全流程端到端自动测试</b>：LLM 连续执行全部步骤，完成后输出完整报告</div>';
  modalHtml+='<div class=\"mode-desc\"><b>逐个交互式测试</b>：每完成一个测试阶段暂停，由你反馈是否继续下一个</div>';
  modalHtml+='<div class=\"btn-row\" style=\"margin-top:16px\">';
  modalHtml+='<button class=\"btn btn-reset\" id=\"modal-cancel\">取消</button>';
  modalHtml+='<button class=\"btn btn-analyze\" id=\"modal-step\">逐个交互式测试</button>';
  modalHtml+='<button class=\"btn btn-start\" id=\"modal-full\">全流程端到端自动测试</button>';
  modalHtml+='</div></div>';
  overlay.innerHTML=modalHtml;
  overlay.querySelector('#modal-cancel').onclick=function(){overlay.remove()};
  overlay.querySelector('#modal-step').onclick=function(){overlay.remove();startAgent('step')};
  overlay.querySelector('#modal-full').onclick=function(){overlay.remove();startAgent('full')};
  document.body.appendChild(overlay);
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove()});
}

function startAgent(mode){
  var source=document.getElementById('cfg-source').value.trim()||'objects/TestApplet';
  var screenshots=document.getElementById('cfg-screenshots').value.trim()||'outputs/screenshots';
  var output=document.getElementById('cfg-output').value.trim()||'outputs';
  if(mode==='step'&&(!stepTasks||stepTasks.length===0)){alert('Click analyze first');return}
  stepMode=(mode==='step');stepPaused=false;stepTaskIdx=0;stepCount=0;failCount=0;
  startTime=Date.now();ssContainer.innerHTML='<div class=\"placeholder\">Waiting for first screenshot...</div>';ssFooter.textContent='';
  logCount.textContent='';statusStep.textContent='';statusTime.textContent='';
  btnAnalyze.disabled=true;btnStart.style.display='none';btnStep.style.display='none';
  btnStop.style.display='';if(stepMode)btnNext.style.display='';
  statusDot.className='dot running';statusText.textContent=mode==='step'?'step mode running...':'full flow running...';
  closeSSE();
  var body={source:source,screenshots:screenshots,output:output,mode:mode,tasks:stepMode?stepTasks:[]};
  fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json()}).then(function(d){
    if(d.error){statusText.textContent='Error: '+d.error;statusDot.className='dot error';resetBtns();return}
    connectSSE();
  }).catch(function(e){statusText.textContent='Connection failed';statusDot.className='dot error';resetBtns()});
}

function nextStep(){
  if(!stepMode)return;
  btnNext.disabled=true;btnNext.textContent='executing...';stepPaused=false;
  document.getElementById('feedback-bar').style.display='none';
  var fb=window._lastFeedback||'';window._lastFeedback='';
  fetch('/api/next',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feedback:fb})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.status==='running'){statusText.textContent='step mode running...';statusDot.className='dot running'}
  }).catch(function(){btnNext.disabled=false;btnNext.textContent='next'});
}

function resetBtns(){btnAnalyze.disabled=false;btnStart.style.display='';btnStep.style.display='none';btnStop.style.display='none';btnNext.style.display='none';btnStart.disabled=true}

function stopAgent(){
  document.getElementById('feedback-bar').style.display='none';
  fetch('/api/stop',{method:'POST'}).then(function(){closeSSE();statusText.textContent='stopped';statusDot.className='dot stopped';resetBtns()});
}

function resetUI(){logList.innerHTML='';ssContainer.innerHTML='<div class=\"placeholder\">Click analyze to view LLM test plan</div>';ssFooter.textContent='';logCount.textContent='';stepCount=0;failCount=0;statusStep.textContent='';statusTime.textContent=''}
function closeSSE(){if(evtSource){evtSource.close();evtSource=null}}

function connectSSE(){
  closeSSE();evtSource=new EventSource('/events');
  evtSource.onopen=function(){statusDot.className='dot running';statusText.textContent='SSE connected'};
  evtSource.onmessage=function(e){
    var d;
    try{d=JSON.parse(e.data)}catch(ex){return}
    if(d.type==='connected'){statusText.textContent='SSE connected, waiting for agent...';statusDot.className='dot running';return}
    if(d.type==='closed'){closeSSE();onSessionEnd();return}
    if(d.type==='step_paused'){onStepPaused(d);return}
    var map=PHASE_MAP[d.type]||[d.type.toUpperCase(),'',''];
    var label=map[0],cssClass=map[1],phaseClass=map[2];
    if(d.type==='step_start'){
      var sd=document.createElement('div');sd.className='step-divider';sd.textContent='-- Step '+d.step+' --';logList.appendChild(sd);
    }else if(d.type==='session_start'){
      var se=document.createElement('div');se.className='log-entry session';
      se.innerHTML='<span class=\"phase phase-session\">SESSION</span> Agent start - '+(d.detail.goal||'')+' - max steps: '+(d.detail.max_steps||'');logList.appendChild(se);
    }else if(d.type==='session_end'){
      var ss=document.createElement('div');ss.className='log-entry session';
      ss.innerHTML='<span class=\"phase phase-session\">SESSION</span> '+d.msg;logList.appendChild(ss);
    }else{
      var div=document.createElement('div');div.className='log-entry '+cssClass;
      var ts=fmtTS(d.ts);
      var detailHtml='';
      if(d.detail&&Object.keys(d.detail).length){
        detailHtml='<div class=\"detail-block\">';
        var keys=Object.keys(d.detail);
        for(var i=0;i<keys.length;i++){detailHtml+='<b>'+keys[i]+':</b> '+d.detail[keys[i]]+'\n';}
        detailHtml+='</div>';
      }
      var badge='';
      if(d.type==='result'){badge=d.msg.indexOf('PASS')>=0?'<span class=\"badge badge-ok\">PASS</span> ':'<span class=\"badge badge-fail\">FAIL</span> ';}
      div.innerHTML='<span class=\"ts\">'+ts+'</span><span class=\"phase '+phaseClass+'\">'+label+'</span>'+badge+d.msg+detailHtml;
      logList.appendChild(div);stepCount++;
      if(d.type==='result'&&d.msg.indexOf('FAIL')>=0)failCount++;
      logCount.textContent=stepCount+' events'+(failCount>0?' - '+failCount+' failed':'');
      statusStep.textContent='Step '+(d.step||'');
      if(startTime)statusTime.textContent=fmtDur((Date.now()-startTime)/1000);
    }
    if(d.screenshot){ssContainer.innerHTML='<img src=\"data:image/png;base64,'+d.screenshot+'\"/>';
      ssFooter.textContent=d.type==='observe'?'Step '+d.step+' - '+(d.detail.route||'')+' - '+(d.detail.element_count||'?')+' elements':
        d.type==='execute'?'Step '+d.step+' - '+(d.detail.type||'')+' '+(d.detail.target||''):
        'Step '+d.step+' - '+d.type;}
    logList.scrollTop=logList.scrollHeight;
  };
  evtSource.onerror=function(e){
    statusDot.className='dot error';statusText.textContent='SSE disconnected - check backend';
    addLogEntry('error','ERROR','phase-error','SSE disconnected. Refresh page or restart Web UI.',{});
  };
}

function onSessionEnd(){
  statusText.textContent=stepMode&&stepTaskIdx<stepTasks.length?'waiting for feedback...':'complete';
  statusDot.className='dot stopped';
  document.getElementById('feedback-bar').style.display='none';
  if(stepMode&&stepTaskIdx<stepTasks.length){
    btnNext.disabled=false;btnNext.textContent='next ('+(stepTaskIdx+1)+'/'+stepTasks.length+')';stepPaused=true;
    statusText.textContent='completed '+(stepTaskIdx+1)+'/'+stepTasks.length+', waiting for feedback...';
    document.getElementById('feedback-bar').style.display='flex';
  }else{resetBtns();btnAnalyze.disabled=false}
}

function onStepPaused(d){
  stepTaskIdx=d.taskIndex||0;stepPaused=true;
  btnNext.disabled=false;btnNext.textContent='next ('+(stepTaskIdx+1)+'/'+stepTasks.length+')';
  statusText.textContent='completed '+(stepTaskIdx+1)+'/'+stepTasks.length+', waiting for feedback...';
  addLogEntry('analysis','ANALYSIS','phase-analysis','Test phase complete. '+(d.msg||'Click next to continue or stop to end'),{});
  document.getElementById('feedback-bar').style.display='flex';
  document.getElementById('feedback-input').focus();
}

function submitFeedback(){
  var input=document.getElementById('feedback-input');
  var text=input.value.trim();
  if(text){addLogEntry('analysis','FEEDBACK','phase-analysis','User feedback: '+text,{feedback:text});window._lastFeedback=text;}
  input.value='';
  document.getElementById('feedback-bar').style.display='none';
  nextStep();
}

function addLogEntry(cssClass,label,phaseClass,msg,detail){
  var div=document.createElement('div');div.className='log-entry '+cssClass;
  var ts=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  var detailHtml='';
  if(detail&&Object.keys(detail).length){
    detailHtml='<div class=\"detail-block\">';
    var keys=Object.keys(detail);
    for(var i=0;i<keys.length;i++){detailHtml+='<b>'+keys[i]+':</b> '+detail[keys[i]]+'\n';}
    detailHtml+='</div>';
  }
  div.innerHTML='<span class=\"ts\">'+ts+'</span><span class=\"phase '+phaseClass+'\">'+label+'</span>'+msg+detailHtml;
  logList.appendChild(div);logList.scrollTop=logList.scrollHeight;
}

// Load available source directories
fetch('/api/projects').then(function(r){return r.json()}).then(function(d){
  var sel=document.getElementById('cfg-source');sel.innerHTML='';
  (d.projects||['objects/TestApplet']).forEach(function(p){
    var opt=document.createElement('option');opt.value=p;opt.textContent=p;sel.appendChild(opt);
  });
  if(d.default)sel.value=d.default;
}).catch(function(){});

</script>
</body>
</html>
